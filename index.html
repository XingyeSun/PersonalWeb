function projectGallery(p){const cover=p.cover||0;const imgs=[...p.images.filter((_,i)=>i!==cover),p.images[cover]];const photo=(im,i)=>`<figure style="order:${i}">${image(im,`${p.title} — photograph ${i+1}`,'project-photo')}${im.caption?`<figcaption>${esc(im.caption)}</figcaption>`:''}</figure>`;return `<section class="project-photo-grid" aria-label="${esc(p.title)} project photographs">${[0,1].map(col=>`<div class="project-photo-column">${imgs.map((im,i)=>i%2===col?photo(im,i):'').join('')}</div>`).join('')}</section>`}
function render(){stopCarousel();const path=location.hash.slice(2).split('/'), page=path[0]||'home';document.querySelectorAll('nav a').forEach(a=>{if(a.hash===`#/${page}`)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});let title='Xingye Sun';
if(page==='home'){main.innerHTML=`${homeCarousel()}<section class="home-intro"><div class="home-name"><h1>XINGYE SUN</h1><p>Jewellery Artist & Designer</p></div><div class="home-statement">${paragraphs(D.statement)}<a class="home-more" href="#/about">READ MORE →</a></div></section><section class="home-section"><div class="home-section-head"><h2>Selected works</h2><a href="#/works">VIEW ALL WORKS →</a></div><div class="home-work-grid">${D.projects.slice(0,4).map(homeWork).join('')}</div></section><section class="home-bottom"><div class="home-about"><h2>About</h2><div class="home-about-body">${image(D.portrait,'Xingye Sun')}<div><p>${esc(D.biography[0])}</p><a class="home-more" href="#/about">READ MORE →</a></div></div></div><div class="home-exhibitions"><div class="home-section-head"><h2>Selected exhibitions</h2><a href="#/exhibitions">VIEW ALL →</a></div>${D.exhibitions.slice(0,3).map(e=>`<a class="home-exhibition" href="#/exhibitions/${e.slug}"><span>${e.year}</span><div>${esc(e.title.toUpperCase())}<small>${esc(e.venue)}</small></div></a>`).join('')}</div></section>`;startCarousel()}
else if(page==='works'&&!path[1]){title='Works';main.innerHTML=`<div class="intro"><h1>Works</h1></div><div class="grid works-index-grid">${D.projects.map(card).join('')}</div>`}
else if(page==='works'){const p=D.projects.find(p=>p.slug===path[1]);if(!p)return missing();title=p.title;const related=D.exhibitions.filter(e=>e.works.includes(p.slug));main.innerHTML=`<a class="back" href="#/works">← All works</a><div class="project-heading"><h1>${esc(p.title)}</h1></div><section class="project-layout"><div class="project-cover">${image(p.images[p.cover||0],p.title,'project-cover-image',true)}</div><div class="project-description"><div class="copy">${paragraphs(p.text)}</div><dl class="project-facts"><dt>Materials</dt><dd>${esc(p.materials)}</dd><dt>Year</dt><dd>${p.year}</dd><dt>Category</dt><dd>${esc(p.type)}</dd>${p.credits?`<dt>Credits</dt><dd>${esc(p.credits)}</dd>`:''}</dl></div></section>${projectGallery(p)}${related.length?`<div class="section-bar"><h2>Exhibited in</h2></div>${related.map(exRow).join('')}`:''}<div class="section-bar"><h2>Explore more</h2><a href="#/works">All works ↗</a></div><div class="grid">${D.projects.filter(x=>x!==p).slice(0,2).map(card).join('')}</div>`}
else if(page==='exhibitions'&&!path[1]){title='Exhibitions';main.innerHTML=`<div class="intro"><h1>Exhibitions</h1></div>${D.exhibitions.map(exRow).join('')}`}
else if(page==='exhibitions'){const e=D.exhibitions.find(x=>x.slug===path[1]);if(!e)return missing();title=e.title;main.innerHTML=`<a class="back" href="#/exhibitions">← All exhibitions</a><div class="project-heading"><h1>${esc(e.title.toUpperCase())}</h1></div><section class="exhibition-information"><div class="copy">${e.text?paragraphs(e.text):`<p>${esc(e.subtitle)}</p>`}<p class="exhibition-location">${esc(e.venue)}</p><p class="exhibition-date">${esc(e.dates)}</p>${e.url?`<p><a href="${esc(e.url)}" target="_blank" rel="noopener">Official exhibition information ↗</a></p>`:''}</div></section><section class="exhibition-photo-grid" aria-label="${esc(e.title)} exhibition photographs">${e.images.map((im,i)=>`<figure>${image(im,`${e.title} — exhibition photograph ${i+1}`,'project-photo')}${im.caption?`<figcaption>${esc(im.caption)}</figcaption>`:''}</figure>`).join('')}</section>${e.works.length?`<div class="section-bar"><h2>Related works</h2></div><div class="grid">${e.works.map(s=>card(D.projects.find(p=>p.slug===s))).join('')}</div>`:''}`}
else if(page==='about'){title='About';main.innerHTML=`<div class="intro"><h1>About</h1><p>Xingye Sun · 孙星烨</p></div><div class="about-top"><div>${image(D.portrait,'Xingye Sun','portrait',true)}</div><div><section class="about-section"><h2>Biography</h2><div class="copy">${paragraphs(D.biography)}</div></section><section class="about-section"><h2>Artist Statement</h2><div class="copy">${paragraphs(D.statement)}</div></section></div></div><div class="credentials"><section><h2>Education & Qualifications</h2><br><div class="credential"><span>2023–Present</span><div>BA (Hons) Jewellery Design<small>Central Saint Martins, University of the Arts London</small></div></div><div class="credential"><span>2025</span><div>Graduate Diamonds Diploma (With Honors)<small>Gemological Institute of America (GIA)</small></div></div><div class="credential"><span>2022–2023</span><div>Foundation Diploma in Art and Design<small>Central Saint Martins, University of the Arts London</small></div></div></section><section><h2>Awards</h2><br><div class="credential"><span>2025</span><div>Cartier Award<small>Central Saint Martins, University of the Arts London</small></div></div></section></div>`}
else if(page==='contact'){title='Contact';main.innerHTML=`<div class="contact"><h1>Contact</h1><div class="contact-row"><span class="eyebrow">Email</span><a href="mailto:monica2570781327@gmail.com">monica2570781327@gmail.com ↗</a></div><div class="contact-row"><span class="eyebrow">Location</span><span>London, UK / Suzhou, China</span></div><div class="contact-row"><span class="eyebrow">Instagram</span><a href="https://www.instagram.com/sun.x.y_art/" target="_blank" rel="noopener">@sun.x.y_art ↗</a></div></div>`}
else return missing();document.title=title === 'Xingye Sun' ? 'Xingye Sun — Jewellery Artist' : `${title} — Xingye Sun`;window.scrollTo(0,0);main.querySelectorAll('.photos img,.lead-image,.project-cover-image,.project-detail-photo,.project-photo-grid img,.exhibition-photo-grid img').forEach(im=>im.addEventListener('click',()=>{const dialog=document.querySelector('dialog');dialog.classList.remove('is-zoomed');dialog.querySelector('#zoom-image').textContent='Zoom +';dialog.querySelector('.lightbox-scroll').scrollTo(0,0);dialog.querySelector('img').src=im.src;dialog.querySelector('img').alt=im.alt;dialog.querySelector('p').textContent=im.alt;dialog.showModal()}));}
function exRow(e){return `<a class="exhibition-row" href="#/exhibitions/${e.slug}"><span class="eyebrow">${e.year}</span><div><h2>${esc(e.title.toUpperCase())}</h2><small>${esc(e.subtitle)}</small></div><div class="venue"><p>${esc(e.venue)}</p><small>${e.dates}</small></div><span>↗</span></a>`}
function missing(){main.innerHTML='<div class="intro"><h1>Page not found</h1><a href="#/">Return home</a></div>'}

const lightbox=document.querySelector('#lightbox');
function toggleImageZoom(){const zoomed=lightbox.classList.toggle('is-zoomed');lightbox.querySelector('#zoom-image').textContent=zoomed?'Zoom −':'Zoom +';const viewport=lightbox.querySelector('.lightbox-scroll');if(zoomed){viewport.scrollLeft=(viewport.scrollWidth-viewport.clientWidth)/2;viewport.scrollTop=(viewport.scrollHeight-viewport.clientHeight)/2}else{viewport.scrollTo(0,0)}}
lightbox.querySelector('#zoom-image').onclick=toggleImageZoom;
const zoomViewport=lightbox.querySelector('.lightbox-scroll'),zoomPhoto=lightbox.querySelector('img');
let imageDrag=null,suppressZoomClick=false;
zoomPhoto.draggable=false;
zoomPhoto.onclick=e=>{if(suppressZoomClick){suppressZoomClick=false;e.preventDefault();return}toggleImageZoom()};
zoomViewport.addEventListener('pointerdown',e=>{if(!lightbox.classList.contains('is-zoomed')||e.button!==0)return;suppressZoomClick=false;imageDrag={id:e.pointerId,x:e.clientX,y:e.clientY,left:zoomViewport.scrollLeft,top:zoomViewport.scrollTop,moved:false};zoomViewport.setPointerCapture(e.pointerId);zoomViewport.classList.add('is-dragging');e.preventDefault()});
zoomViewport.addEventListener('pointermove',e=>{if(!imageDrag||imageDrag.id!==e.pointerId)return;const dx=e.clientX-imageDrag.x,dy=e.clientY-imageDrag.y;if(Math.abs(dx)+Math.abs(dy)>4)imageDrag.moved=true;zoomViewport.scrollLeft=imageDrag.left-dx;zoomViewport.scrollTop=imageDrag.top-dy});
function endImageDrag(e){if(!imageDrag||imageDrag.id!==e.pointerId)return;suppressZoomClick=imageDrag.moved;imageDrag=null;zoomViewport.classList.remove('is-dragging');if(zoomViewport.hasPointerCapture(e.pointerId))zoomViewport.releasePointerCapture(e.pointerId)}
zoomViewport.addEventListener('pointerup',endImageDrag);zoomViewport.addEventListener('pointercancel',endImageDrag);zoomViewport.addEventListener('lostpointercapture',e=>{if(imageDrag&&imageDrag.id===e.pointerId){imageDrag=null;zoomViewport.classList.remove('is-dragging')}});
lightbox.addEventListener('close',()=>{imageDrag=null;suppressZoomClick=false;zoomViewport.classList.remove('is-dragging')});


document.querySelector('#close').onclick=()=>document.querySelector('dialog').close();document.querySelector('dialog').addEventListener('click',e=>{if(e.target.tagName==='DIALOG')e.target.close()});window.addEventListener('hashchange',render);render();

 document.querySelector('.skip').addEventListener('click',e=>{e.preventDefault();main.tabIndex=-1;main.focus()});

</script></body></html>
