    "Xingye Sun (孙星烨) is a London-based jewellery artist and designer from Suzhou, China. She is currently in the final year of her BA (Hons) Jewellery Design degree at Central Saint Martins, University of the Arts London.",
    "Her practice includes contemporary art jewellery and wearable objects. She explores the relationship between form, materials and wearability, bringing together sculptural expression and functional design."
  ],
  "statement": [
    "My work often begins with something familiar: a place, a personal memory, or an everyday object. I am interested in how these experiences shape our understanding of ourselves and our relationships with others.",
    "What draws me to jewellery is its intimate relationship with the body and the way it becomes part of everyday life. Through my work, I explore how memories and emotions can take physical form, allowing personal experiences to be carried with us and gain new meaning through wearing."
  ]
};
</script>
<script>
const D=window.CONTENT, main=document.querySelector('main');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const image=(i,alt,cls='',eager=false)=>`<img class="${cls}" src="${i.src}" width="${i.width}" height="${i.height}" alt="${esc(alt)}" ${eager?'fetchpriority="high"':'loading="lazy"'}>`;
const paragraphs=a=>a.map(p=>`<p>${esc(p)}</p>`).join('');
const card=p=>`<a class="card" href="#/works/${p.slug}">${image(p.images[p.cover||0],p.title)}<div class="caption"><h3>${esc(p.title)}</h3><small>${p.year} · ${p.type}</small></div></a>`;
const gallery=(imgs,title)=>`<div class="photos">${imgs.map((i,n)=>`<figure>${image(i,`${title} — photograph ${n+1}`)}${i.caption?`<figcaption>${esc(i.caption)}</figcaption>`:''}</figure>`).join('')}</div>`;
function render(){const path=location.hash.slice(2).split('/'), page=path[0]||'home';document.querySelectorAll('nav a').forEach(a=>{if(a.hash===`#/${page}`)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});let title='Xingye Sun';
if(page==='home'){const p=D.projects[0];main.innerHTML=`<div class="home-title"><h1>Xingye Sun</h1><p class="eyebrow">Jewellery artist & designer<br>London / Suzhou</p></div><a class="hero" href="#/works/${p.slug}">${image(p.images[p.cover||0],p.title,'',true)}<div class="hero-label"><span>${p.title}</span><span>2024 · View project ↗</span></div></a><div class="section-bar"><h2>Selected works</h2><a href="#/works">All works ↗</a></div><div class="grid">${D.projects.slice(1,5).map(card).join('')}</div>`}
else if(page==='works'&&!path[1]){title='Works';main.innerHTML=`<div class="intro"><h1>Works</h1><p>Contemporary art jewellery<br>and wearable objects · 2022–2025</p></div><div class="grid">${D.projects.map(card).join('')}</div>`}
else if(page==='works'){const p=D.projects.find(p=>p.slug===path[1]);if(!p)return missing();title=p.title;const related=D.exhibitions.filter(e=>e.works.includes(p.slug));main.innerHTML=`<a class="back" href="#/works">← All works</a><div class="detail-head"><h1>${esc(p.title)}</h1><dl class="meta"><dt>Year / Object</dt><dd>${p.year} / ${p.type}</dd><dt>Materials</dt><dd>${esc(p.materials)}</dd>${p.credits?`<dt>Credits</dt><dd>${esc(p.credits)}</dd>`:''}</dl></div>${image(p.images[p.cover||0],p.title,'lead-image',true)}<div class="story"><h2>About the work</h2><div class="copy">${paragraphs(p.text)}</div></div>${gallery(p.images.filter((_,i)=>i!==(p.cover||0)),p.title)}${related.length?`<div class="section-bar"><h2>Exhibited in</h2></div>${related.map(exRow).join('')}`:''}<div class="section-bar"><h2>Explore more</h2><a href="#/works">All works ↗</a></div><div class="grid">${D.projects.filter(x=>x!==p).slice(0,2).map(card).join('')}</div>`}
else if(page==='exhibitions'&&!path[1]){title='Exhibitions';main.innerHTML=`<div class="intro"><h1>Exhibitions</h1><p>Selected group exhibitions<br>2023–2025</p></div>${D.exhibitions.map(exRow).join('')}`}
else if(page==='exhibitions'){const e=D.exhibitions.find(x=>x.slug===path[1]);if(!e)return missing();title=e.title;main.innerHTML=`<a class="back" href="#/exhibitions">← All exhibitions</a><div class="detail-head"><div><p class="eyebrow">${esc(e.subtitle)}</p><h1>${esc(e.title)}</h1></div><div class="meta"><p>${e.dates}</p><p>${esc(e.venue)}</p>${e.url?`<p><a href="${esc(e.url)}" target="_blank" rel="noopener">Official exhibition information ↗</a></p>`:''}</div></div>${e.images.length?image(e.images[0],e.title+' — exhibition view','lead-image',true):''}<div class="story"><h2>Exhibition views</h2><div class="copy"><p>${esc(e.title)} — ${esc(e.subtitle)}<br>${esc(e.venue)}<br>${e.dates}</p></div></div>${gallery(e.images.slice(1),e.title)}${e.works.length?`<div class="section-bar"><h2>Related works</h2></div><div class="grid">${e.works.map(s=>card(D.projects.find(p=>p.slug===s))).join('')}</div>`:''}`}
else if(page==='about'){title='About';main.innerHTML=`<div class="intro"><h1>About</h1><p>Xingye Sun · 孙星烨</p></div><div class="about-top"><div>${image(D.portrait,'Xingye Sun','portrait',true)}</div><div><section class="about-section"><h2>Biography</h2><div class="copy">${paragraphs(D.biography)}</div></section><section class="about-section"><h2>Artist Statement</h2><div class="copy">${paragraphs(D.statement)}</div></section></div></div><div class="credentials"><section><h2>Education & Qualifications</h2><br><div class="credential"><span>2023–Present</span><div>BA (Hons) Jewellery Design<small>Central Saint Martins, University of the Arts London</small></div></div><div class="credential"><span>2025</span><div>Graduate Diamonds Diploma with Honors<small>GIA</small></div></div><div class="credential"><span>2022–2023</span><div>Foundation Diploma in Art and Design<small>Central Saint Martins, University of the Arts London</small></div></div></section><section><h2>Awards</h2><br><div class="credential"><span>2025</span><div>Cartier Award<small>Central Saint Martins, University of the Arts London</small></div></div></section></div>`}
else if(page==='contact'){title='Contact';main.innerHTML=`<div class="contact"><h1>Contact</h1><div class="contact-row"><span class="eyebrow">Email</span><a href="mailto:monica2570781327@gmail.com">monica2570781327@gmail.com ↗</a></div><div class="contact-row"><span class="eyebrow">Location</span><span>London, UK / Suzhou, China</span></div><div class="contact-row"><span class="eyebrow">Instagram</span><a href="https://www.instagram.com/sun.x.y_art/" target="_blank" rel="noopener">@sun.x.y_art ↗</a></div></div>`}
else return missing();document.title=title === 'Xingye Sun' ? 'Xingye Sun — Jewellery Artist' : `${title} — Xingye Sun`;window.scrollTo(0,0);main.querySelectorAll('.photos img,.lead-image').forEach(im=>im.addEventListener('click',()=>{const dialog=document.querySelector('dialog');dialog.querySelector('img').src=im.src;dialog.querySelector('img').alt=im.alt;dialog.querySelector('p').textContent=im.alt;dialog.showModal()}));}
function exRow(e){return `<a class="exhibition-row" href="#/exhibitions/${e.slug}"><span class="eyebrow">${e.year}</span><div><h2>${esc(e.title)}</h2><small>${esc(e.subtitle)}</small></div><div class="venue"><p>${esc(e.venue)}</p><small>${e.dates}</small></div><span>↗</span></a>`}
function missing(){main.innerHTML='<div class="intro"><h1>Page not found</h1><a href="#/">Return home</a></div>'}
document.querySelector('#close').onclick=()=>document.querySelector('dialog').close();document.querySelector('dialog').addEventListener('click',e=>{if(e.target.tagName==='DIALOG')e.target.close()});window.addEventListener('hashchange',render);render();

 document.querySelector('.skip').addEventListener('click',e=>{e.preventDefault();main.tabIndex=-1;main.focus()});

</script></body></html>
